name: "Repository Baseline Review & High-Value Improvement"
description: "Review repository against Conxian baseline standards and execute a single high-value task."
title: "[BASELINE] <Repository Name> - <Task Summary>"
labels: ["governance", "baseline-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Conxian Repository Baseline Review Protocol
        Use this issue template to track repository baseline reviews and record execution of high-value repo hygiene or governance improvements across Conxian repositories.

        **Security Notice:** Do not expose secrets or sensitive configuration. For security vulnerabilities, follow [SECURITY.md](https://github.com/Conxian/.github/blob/main/SECURITY.md).
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the primary objective of this baseline review and improvement task.
      placeholder: Review this repository and complete the next highest-value improvement using the Conxian GitHub review baseline.
    validations:
      required: true
  - type: input
    id: repo-focus
    attributes:
      label: Repo focus
      description: Target repository name (e.g., conxian-nexus).
      placeholder: conxian-nexus
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Baseline review context
        Known cross-org concerns:
        - public/private separation risk
        - possible sensitive config exposure such as `.env`
        - tracked generated/runtime artifacts such as:
          - `node_modules`
          - `test-results`
          - `playwright-report`
        - inconsistent governance and repo standards
        - missing files may include:
          - `README`
          - `LICENSE`
          - `SECURITY.md`
          - `CONTRIBUTING.md`
          - `CODEOWNERS`
        - changelog / release guidance
        - weak release/versioning discipline
        - unclear public-facing purpose/status
  - type: dropdown
    id: priority-tier
    attributes:
      label: Task Priority Level
      description: Select the priority category of the selected task (Inspect repository and select exactly one high-value, self-contained task).
      options:
        - "1. Security exposure or public/private boundary risk"
        - "2. Sensitive files or generated artifacts tracked in git"
        - "3. Missing ignore rules or CI hygiene"
        - "4. Missing governance files / issue templates"
        - "5. README / public-facing clarity improvements"
        - "6. Release / versioning improvements"
    validations:
      required: true
  - type: textarea
    id: task-selection
    attributes:
      label: Task for agent & Evidence
      description: Describe the single task selected, why it was chosen, and evidence found in the repo inspection.
      placeholder: |
        Selected task: Update Repository Baseline Review issue template and add Markdown variant.
        Why chosen: Ensure full alignment with Conxian Linear issue template standards across org.
        Evidence found: Existing template lacked explicit markdown sections and Linear baseline alignment.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Required workflow
        - inspect the repo before making changes
        - select one task only
        - record evidence for why it was selected
        - implement the change fully
        - run relevant validation
        - update all related docs
        - prepare approval-ready notes
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables & Verification
      description: Provide selected task, evidence found, files changed, validation results, documentation updated, and follow-up items.
      placeholder: |
        - Selected task: Standardize repository baseline review templates
        - Files changed: .github/ISSUE_TEMPLATE/repo_baseline_review.yml, .github/ISSUE_TEMPLATE/repo_baseline_review.md
        - Validation results: python3 scripts/verify_contamination_guard.py, ./scripts/check_production_boundary.sh, cargo test --lib
        - Documentation updated: Issue template documentation synced
        - Follow-up items: None
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Constraints
        - do not expose or commit secrets
        - if likely secrets are found, prioritize remediation and note required rotation/manual follow-up
        - avoid broad speculative refactors
        - prefer minimal, high-confidence changes
        - improve existing governance/docs rather than duplicating them

        ### Definition of done
        - one meaningful repo improvement completed
        - relevant validation performed
        - docs updated to match
        - ready for human approval
  - type: textarea
    id: approval-notes
    attributes:
      label: Approval Note
      description: Approval-ready notes for human review.
      placeholder: Ready for human review and approval. All tests and boundary verification checks pass.
    validations:
      required: true
