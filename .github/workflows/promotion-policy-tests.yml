name: Promotion policy regression tests

on:
  pull_request:
    branches: [dev, staged, main]
    paths:
      - 'scripts/branch_promotion_policy.py'
      - 'scripts/tests/*promotion*.py'
      - '.github/workflows/*promotion*'
  push:
    branches: [dev, staged, main]
    paths:
      - 'scripts/branch_promotion_policy.py'
      - 'scripts/tests/*promotion*.py'
      - '.github/workflows/*promotion*'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test policy against valid and invalid PR events
        run: python3 -m unittest discover -s scripts/tests -p 'test_*promotion*.py' -v
