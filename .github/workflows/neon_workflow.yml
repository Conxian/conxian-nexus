name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}
      # NOTE: the branch db_url is a step output consumed within THIS job.
      # It cannot be propagated as a job output because GitHub Actions skips
      # job outputs that "may contain secret" (the connection string embeds a
      # username + password), so migrations and the conformance suite run here.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply idempotency migrations
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          for f in migrations/20260829000000_idempotency.sql \
                   migrations/20260830000000_idempotency_high_water.sql \
                   migrations/20260912000000_idempotency_locks.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Run live-DB conformance suite
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          # sqlx (rustls) does not implement SCRAM channel binding; drop the
          # requirement if Neon appends it while keeping SSL required.
          export DATABASE_URL="${DATABASE_URL/channel_binding=require/sslmode=require}"
          if [[ "$DATABASE_URL" != *sslmode=* ]]; then
            export DATABASE_URL="${DATABASE_URL}?sslmode=require"
          fi
          cargo test --test idempotency_conformance -- --test-threads=1

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
