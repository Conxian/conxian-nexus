name: Auto-Promotion

on:
  push:
    branches: [dev, staged]
  schedule:
    # Hourly dwell re-check: promotes staged -> main once the minimum soak is met.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to promote from
        required: true
        type: choice
        options: [dev, staged]
      target_branch:
        description: Target branch to promote into
        required: true
        type: choice
        options: [staged, main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-promotion-${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    name: Create immutable promotion candidate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    env:
      # Minimum soak time (hours) a staged head must age before it may be
      # promoted to main. Override via the repo variable MIN_MAINNET_DWELL_HOURS
      # (set to 0 to disable the dwell gate).
      MIN_MAINNET_DWELL_HOURS: ${{ vars.MIN_MAINNET_DWELL_HOURS || '24' }}
    steps:
      - name: Determine promotion lane
        id: branches
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || '' }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || '' }}
        run: |
          set -euo pipefail
          SOURCE="$SOURCE_REF"
          TARGET="$TARGET_REF"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Hourly dwell re-check targets the soak-gated staged -> main lane.
            SOURCE="staged"
            TARGET="main"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${SOURCE}:${TARGET}" in
              dev:staged|staged:main) ;;
              *)
                echo "::error::Invalid promotion pair: ${SOURCE} -> ${TARGET}. Allowed: dev->staged, staged->main"
                exit 1
                ;;
            esac
          else
            # push event
            SOURCE="${{ github.ref_name }}"
            if [ "$SOURCE" = "dev" ]; then
              TARGET="staged"
            elif [ "$SOURCE" = "staged" ]; then
              TARGET="main"
            else
              echo "::error::Unsupported source branch: $SOURCE"
              exit 1
            fi
          fi

          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || steps.branches.outputs.source }}
          fetch-depth: 0

      - name: Capture exact candidate evidence
        id: details
        env:
          SOURCE: ${{ steps.branches.outputs.source }}
          TARGET: ${{ steps.branches.outputs.target }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE" "$TARGET"

          SOURCE_SHA=$(git rev-parse HEAD)
          TARGET_SHA=$(git rev-parse "origin/${TARGET}")
          if ! git merge-base "$SOURCE_SHA" "$TARGET_SHA" >/dev/null; then
            echo "::error::Source and target have no merge base. Refusing bulk synchronization; open a reviewed manual promotion PR after lineage reconciliation."
            exit 1
          fi

          COMMIT_WINDOW="${TARGET_SHA}..${SOURCE_SHA}"
          COMMITS=$(git log "$COMMIT_WINDOW" --oneline --no-merges | head -20 || true)
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No new commits to promote from ${SOURCE}@${SOURCE_SHA} to ${TARGET}@${TARGET_SHA}."
            exit 0
          fi

          # Minimum dwell (soak) gate for staged -> main releases. The staged
          # head must have aged at least MIN_MAINNET_DWELL_HOURS before it may
          # be promoted to main (which fires the production deploy).
          if [ "$SOURCE" = "staged" ] && [ "$TARGET" = "main" ]; then
            SOURCE_HEAD_TIME=$(git log -1 --format=%ct "$SOURCE_SHA")
            NOW=$(date +%s)
            AGE_SECONDS=$(( NOW - SOURCE_HEAD_TIME ))
            MIN_SECONDS=$(( MIN_MAINNET_DWELL_HOURS * 3600 ))
            if [ "$AGE_SECONDS" -lt "$MIN_SECONDS" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::staged->main dwell not yet met: source commit ${SOURCE_SHA} is ${AGE_SECONDS}s old (< ${MIN_SECONDS}s = ${MIN_MAINNET_DWELL_HOURS}h). Re-checking on the next schedule."
              exit 0
            fi
          fi

          PROMO_BRANCH="promotion/${SOURCE}-to-${TARGET}-${SOURCE_SHA}"
          {
            echo "skip=false"
            echo "source_sha=${SOURCE_SHA}"
            echo "target_sha=${TARGET_SHA}"
            echo "commit_window=${COMMIT_WINDOW}"
            echo "promo_branch=${PROMO_BRANCH}"
            echo 'commit_summary<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Detect exact existing candidate PR
        if: steps.details.outputs.skip != 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.ORG_RECONCILE_PAT }}
          TARGET: ${{ steps.branches.outputs.target }}
          PROMO_BRANCH: ${{ steps.details.outputs.promo_branch }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "$TARGET" \
            --head "$PROMO_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // ""')
          echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTING" ]; then
            echo "::notice::Exact promotion candidate PR #${EXISTING} already exists."
          fi

      - name: Publish immutable candidate ref
        if: steps.details.outputs.skip != 'true' && steps.existing.outputs.number == ''
        env:
          PROMO_BRANCH: ${{ steps.details.outputs.promo_branch }}
          SOURCE_SHA: ${{ steps.details.outputs.source_sha }}
        run: |
          set -euo pipefail
          git branch "$PROMO_BRANCH" "$SOURCE_SHA"
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/${PROMO_BRANCH}" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$SOURCE_SHA" ]; then
            # This step runs only when no open PR exists for this branch (the
            # existing-PR step gates it), so a ref at a different SHA is stale
            # residue from a previously merged/closed candidate. Delete it and
            # republish rather than refusing, so re-promotion after a drift
            # shift proceeds instead of deadlocking on a ghost ref.
            echo "::notice::Stale immutable candidate ref ${PROMO_BRANCH}@${REMOTE_SHA} (no open PR); deleting and republishing at ${SOURCE_SHA}."
            git push origin --delete "$PROMO_BRANCH"
          fi
          git push -u origin "$PROMO_BRANCH"

      - name: Build promotion PR body
        if: steps.details.outputs.skip != 'true' && steps.existing.outputs.number == ''
        env:
          SOURCE: ${{ steps.branches.outputs.source }}
          TARGET: ${{ steps.branches.outputs.target }}
          SOURCE_SHA: ${{ steps.details.outputs.source_sha }}
          TARGET_SHA: ${{ steps.details.outputs.target_sha }}
          COMMIT_WINDOW: ${{ steps.details.outputs.commit_window }}
          COMMIT_SUMMARY: ${{ steps.details.outputs.commit_summary }}
        run: |
          python3 - <<'PY'
          import datetime
          import os

          source = os.environ["SOURCE"]
          target = os.environ["TARGET"]
          source_sha = os.environ["SOURCE_SHA"]
          target_sha = os.environ["TARGET_SHA"]
          window = os.environ["COMMIT_WINDOW"]
          commits = os.environ["COMMIT_SUMMARY"]
          metadata = f"""### Exact promotion evidence

          - Promotion source SHA: `{source_sha}`
          - Promotion target-base SHA: `{target_sha}`
          - Promotion commit window: `{window}`

          ### Included changes

          ```text
          {commits}
          ```
          """

          if (source, target) == ("dev", "staged"):
              body = f"""## Dev -> staged promotion

          Immutable candidate generated from the exact `dev` revision recorded below.

          {metadata}

          <!-- PROMOTION:DEV->STAGED -->
          ### Dev -> staged promotion checklist

          - [ ] Integrated testnet validation completed on `dev` and is linked here.
          - [ ] Required CI checks are green for the exact promotion candidate commit.
          - [ ] Wallet / signer / treasury boundary checks are explicitly recorded.
          - [ ] Deployment boundary checks are explicitly recorded.
          - [ ] Any required submodule pins, lockfiles, and artifact provenance are updated.
          """
          else:
              body = f"""## Staged -> main promotion

          Immutable candidate generated from the exact `staged` revision recorded below.

          {metadata}

          <!-- PROMOTION:STAGED->MAIN -->
          ### Mainnet acceptance evidence pack

          #### Promotion metadata
          Complete all fields required by `openspec/specs/mainnet-acceptance-evidence-pack/spec.md`.

          #### Mainnet-only production scope
          Complete before review.

          #### Contamination and residue proof
          Complete before review.

          #### Successful production validation
          Complete before review.

          #### Release-readiness sign-off
          Complete before review.

          #### Owner accountability
          Complete before review.
          """

          date_str = datetime.date.today().isoformat()
          title = f"PROMOTION:{source.upper()}->{target.upper()} — {date_str} — {source_sha[:12]}"
          with open("pr_body.md", "w", encoding="utf-8") as handle:
              handle.write(body)
          with open("pr_title.txt", "w", encoding="utf-8") as handle:
              handle.write(title)
          PY

      - name: Open draft promotion PR
        if: steps.details.outputs.skip != 'true' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.ORG_RECONCILE_PAT }}
          TARGET: ${{ steps.branches.outputs.target }}
          PROMO_BRANCH: ${{ steps.details.outputs.promo_branch }}
        run: |
          set -euo pipefail
          if ! gh pr create \
            --repo "${{ github.repository }}" \
            --base "$TARGET" \
            --head "$PROMO_BRANCH" \
            --draft \
            --title "$(cat pr_title.txt)" \
            --body-file pr_body.md; then
            echo "::error::Automatic PR creation is unavailable. The immutable candidate ref remains published; open a manual promotion PR from ${PROMO_BRANCH} to ${TARGET} using pr_body.md without rewriting the ref."
            exit 1
          fi

      - name: Leave promotion PR as draft for manual review
        if: steps.details.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ORG_RECONCILE_PAT }}
          SOURCE: ${{ steps.branches.outputs.source }}
          TARGET: ${{ steps.branches.outputs.target }}
          SOURCE_SHA: ${{ steps.details.outputs.source_sha }}
          TARGET_SHA: ${{ steps.details.outputs.target_sha }}
          PROMO_BRANCH: ${{ steps.details.outputs.promo_branch }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "$TARGET" \
            --head "$PROMO_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // ""')
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Promotion PR not found for ${PROMO_BRANCH} -> ${TARGET}."
            exit 1
          fi

          # Autopull: re-check the latest source/target before merging. If the
          # source advanced, this candidate is stale and a newer promotion
          # supersedes it; if the target advanced, pull it into the candidate.
          git fetch --no-tags origin "$SOURCE" "$TARGET"
          LATEST_SOURCE=$(git rev-parse "origin/${SOURCE}")
          LATEST_TARGET=$(git rev-parse "origin/${TARGET}")
          if [ "${LATEST_SOURCE}" != "${SOURCE_SHA}" ]; then
            echo "::notice::Source ${SOURCE} advanced past ${SOURCE_SHA}; closing stale candidate (newer promotion supersedes it)."
            gh pr close "$PR_NUMBER" --repo "${{ github.repository }}" --delete-branch
            exit 0
          fi
          if [ "${LATEST_TARGET}" != "${TARGET_SHA}" ]; then
            echo "::notice::Target ${TARGET} advanced past ${TARGET_SHA}; updating candidate branch before merge."
            gh pr update-branch "$PR_NUMBER" --repo "${{ github.repository }}" || echo "::notice::Could not auto-update branch; proceeding."
          fi

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "Promotion candidate left as DRAFT. Manual review required before merge: fill the evidence pack and confirm all required CI checks are green."
          echo "::notice::Promotion PR #${PR_NUMBER} left as DRAFT for manual review (no auto-merge)."

      - name: Report nothing to promote
        if: steps.details.outputs.skip == 'true'
        run: echo "::notice::Nothing to promote (no new commits in the window, or the staged->main dwell has not elapsed)."
