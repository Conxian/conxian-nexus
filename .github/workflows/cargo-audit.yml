name: Cargo Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: |
          # NOTE: `cargo generate-lockfile` was intentionally removed (2026-08-28).
          # Upstream yanked the entire `secp256k1 0.32.0-beta.*` series (superseded by
          # 0.33.0), which breaks fresh resolution of the `bitcoin 0.33.0-beta`
          # dependency used by the enclave-sdk. The committed Cargo.lock still pins
          # the yanked (but downloadable) version, so audit the committed lockfile
          # directly instead of regenerating it.
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0258
