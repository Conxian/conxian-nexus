name: Container initialization

on:
  pull_request:
    branches: [dev, staged, main]
    paths: [Dockerfile, .dockerignore, 'src/**', 'migrations/**', Cargo.toml, Cargo.lock, 'scripts/container_init_smoke.py', '.github/workflows/container-init.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build locked release image
        run: docker build --tag conxian-nexus:init .
      - name: Exercise initialization, outage, recovery and restart
        run: python3 scripts/container_init_smoke.py --image conxian-nexus:init
