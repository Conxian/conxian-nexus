name: Rust

on:
  push:
    branches: [ "main", "staged", "dev" ]
  pull_request:
    branches: [ "main", "staged", "dev" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: Repo Hygiene & Contamination Guard
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.x'
    - name: Run Contamination Guard
      run: python3 scripts/verify_contamination_guard.py
    - name: Verify Submodule Integrity
      run: python3 scripts/verify_submodule_integrity.py
    - name: Clarity 4 Contract Verification
      run: ./scripts/verify_contracts.sh
    - name: BOS Production Boundary Check (Bash)
      run: ./scripts/check_production_boundary.sh
    - name: Parse all workflow YAML
      run: ruby scripts/check_workflow_yaml.rb
    - name: Check Lightning coverage source contracts
      run: python3 -m unittest discover -s scripts -p test_check_lightning_coverage.py
    - name: Install Gitleaks
      run: |
        VERSION="8.18.2"
        curl -L https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz -o gitleaks.tar.gz
        echo "6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee  gitleaks.tar.gz" | sha256sum --check
        tar -xzf gitleaks.tar.gz
        sudo mv gitleaks /usr/local/bin/
    - name: Secret Scanning (Gitleaks)
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request commit range" >&2
            exit 1
          fi
          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" || ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
            echo "Pull request commit range is unavailable in the checkout" >&2
            exit 1
          fi
          gitleaks detect --source . -v --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
        else
          gitleaks detect --source . -v
        fi

  build:
    name: Build & Test
    needs: hygiene
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: conformance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-fixture-only
        ports:
          - "5432"
        options: >-
          --label conxian.fixture=nexus-workflow-recovery
          --label conxian.fixture.role=source
          --health-cmd "pg_isready -U postgres -d conformance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      workflow_restore:
        image: postgres:17
        env:
          POSTGRES_DB: conformance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-fixture-only
        options: >-
          --label conxian.fixture=nexus-workflow-recovery
          --label conxian.fixture.role=restore
          --health-cmd "pg_isready -U postgres -d conformance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: "1.98.1"
        components: clippy, rustfmt
    - name: Run rustfmt check
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Create dedicated non-superuser conformance role
      env:
        POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        RESTORE_CONTAINER_ID: ${{ job.services.workflow_restore.id }}
      run: |
        for fixture in "$POSTGRES_CONTAINER_ID" "$RESTORE_CONTAINER_ID"; do
          docker exec "$fixture" psql --username postgres --dbname conformance_test --set ON_ERROR_STOP=1 --command "CREATE ROLE conformance LOGIN PASSWORD 'conformance-fixture-only'; ALTER DATABASE conformance_test OWNER TO conformance;"
        done
    - name: Verify recovery fixture rejection and receipt checks
      run: python3 -m unittest discover -s scripts -p test_verify_workflow_restore.py -v
    - name: Verify conformance configuration guards
      run: cargo test --locked --test conformance_config
    - name: Require a fixture and ignore generic application DATABASE_URL
      run: |
        if DATABASE_URL=postgres://unused:unused@127.0.0.1:1/application env -u CONFORMANCE_DATABASE_URL -u ALLOW_DESTRUCTIVE_TEST_RESET cargo test --locked --test idempotency_conformance conformance_single_consume_once -- --exact > "$RUNNER_TEMP/conformance-missing.log" 2>&1; then
          echo "Conformance unexpectedly passed without its explicit fixture" >&2
          exit 1
        fi
        grep -q 'CONFORMANCE_DATABASE_URL is required' "$RUNNER_TEMP/conformance-missing.log"
    - name: Fail when the selected disposable fixture is unavailable
      env:
        CONFORMANCE_DATABASE_URL: postgres://conformance:fixture-only@127.0.0.1:1/conformance_test
        ALLOW_DESTRUCTIVE_TEST_RESET: 'true'
      run: |
        if cargo test --locked --test idempotency_conformance conformance_single_consume_once -- --exact > "$RUNNER_TEMP/conformance-unavailable.log" 2>&1; then
          echo "Conformance unexpectedly passed with an unavailable fixture" >&2
          exit 1
        fi
        grep -q 'disposable PostgreSQL fixture is unavailable' "$RUNNER_TEMP/conformance-unavailable.log"
    - name: Run tests
      env:
        CONFORMANCE_DATABASE_URL: postgres://conformance:conformance-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/conformance_test
        ALLOW_DESTRUCTIVE_TEST_RESET: 'true'
      run: cargo test --workspace --locked --verbose
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --locked
    - name: Enforce Lightning scoped coverage (>=90%)
      run: python3 scripts/check_lightning_coverage.py --min-percent 90
    - name: Enforce Bitcoin scoped coverage (>=92%)
      run: ./scripts/coverage_bitcoin.sh 92
    - name: Publish Bitcoin coverage summary
      if: always()
      run: |
        if [ -f target/coverage/bitcoin/summary.md ]; then
          cat target/coverage/bitcoin/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload Bitcoin coverage artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bitcoin-coverage
        path: |
          target/coverage/bitcoin/llvm-cov-bitcoin.json
          target/coverage/bitcoin/summary.json
          target/coverage/bitcoin/summary.md
        if-no-files-found: warn
    # Must stay after every test/coverage command: this stops the source fixture.
    - name: Recover persisted workflow rows after source instance loss
      env:
        SOURCE_CONTAINER_ID: ${{ job.services.postgres.id }}
        RESTORE_CONTAINER_ID: ${{ job.services.workflow_restore.id }}
      run: |
        python3 scripts/verify_workflow_restore.py \
          --source-container "$SOURCE_CONTAINER_ID" \
          --restore-container "$RESTORE_CONTAINER_ID" \
          --source-sha "$GITHUB_SHA" \
          --output "$RUNNER_TEMP/workflow-recovery.json"
    - name: Upload bounded workflow recovery measurements
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflow-recovery
        path: ${{ runner.temp }}/workflow-recovery.json
        if-no-files-found: error
