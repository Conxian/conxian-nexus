name: Repository License Governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-licenses:
    name: Dependency license policy and artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.98.1"
      - name: Parse all workflow YAML
        run: ruby scripts/check_workflow_yaml.rb
      - name: Install pinned compliance tools
        run: |
          cargo install --locked cargo-deny --version 0.18.6
          cargo install --locked cargo-about --version 0.8.2
          cargo install --locked cargo-cyclonedx --version 0.5.7
      - name: Enforce dependency policy and generate artifacts
        run: scripts/run_license_compliance.sh
      - name: Upload compliance artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: license-compliance-${{ github.sha }}
          path: target/compliance/
          if-no-files-found: error
