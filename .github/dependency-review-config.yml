license-check: true
vulnerability-check: true
fail-on-severity: low
fail-on-scopes:
  - runtime
  - development
  - unknown
comment-summary-in-pr: on-failure
retry-on-snapshot-warnings: true
show-openssf-scorecard: true

# Keep this list aligned with deny.toml. It intentionally excludes BUSL,
# copyleft licenses, and dependencies without asserted license metadata.
allow-licenses:
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - CDLA-Permissive-2.0
  - ISC
  - MIT
  - MIT-0
  - Unicode-3.0
  - Unlicense
  - Zlib

# BSL-1.0 is Boost Software License 1.0, not Business Source License 1.1.
# Pin the exception to the exact resolved package rather than allowing BSL-1.0
# repository-wide.
allow-dependencies-licenses:
  - pkg:cargo/xxhash-rust@0.8.15
