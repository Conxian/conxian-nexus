# CircleCI lane: activates as soon as the project is set up in CircleCI.
version: 2.1
jobs:
  test:
    docker:
      - image: cimg/rust:1.100.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: system deps
          command: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev > /dev/null
      - restore_cache:
          keys:
            - cargo-{{ checksum "Cargo.lock" }}
      - run:
          name: test
          command: cargo test --locked --lib
      - save_cache:
          key: cargo-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target
workflows:
  ci:
    jobs: [test]
